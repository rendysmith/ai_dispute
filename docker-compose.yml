# Деплой ai-dispute на VDS (docker compose).
#
# На сервере в одной папке должны лежать:
#   docker-compose.yml   — этот файл
#   .env                 — переменные окружения (см. .env.example в репозитории)
#   secrets/service_account.json — Google service account (в git НЕ хранится!)
#
# IMAGE подставляется из .env, например:
#   IMAGE=ghcr.io/rendysmith/ai_dispute:latest
# (деплой-скрипт добавляет актуальный IMAGE в .env на сервере автоматически)
#
# Запуск вручную:  docker compose pull && docker compose up -d
# Автодеплой:      push в main → GitHub Actions собирает образ и выполняет
#                  deploy/deploy.sh на сервере по SSH.

services:
  ai-dispute:
    image: ${IMAGE:-ghcr.io/rendysmith/ai_dispute:latest}
    container_name: ai-dispute
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # В контейнере браузеры всегда headless
      HEADLESS: "true"
      PROXY_ON: "false"
      RUNNING_IN_CONTAINER: "true"
    volumes:
      # Google service account — файл лежит на сервере, а не в git
      - ./secrets/service_account.json:/app/utils/service_account.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # Сервер: AMD 2 ядра / 4 ГБ. Планировщик внутри сервиса читает эти
          # лимиты из cgroup и не запускает парсеры сверх них (HTTP 429).
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
