# Деплой ai-dispute на VDS (docker compose).
#
# На сервере в одной папке должны лежать:
#   docker-compose.yml   — этот файл
#   .env                 — переменные окружения (см. .env.example в репозитории)
#   secrets/service_account.json — Google service account (в git НЕ хранится!)
#
# IMAGE подставляется из .env, например:
#   IMAGE=ghcr.io/rendysmith/ai_dispute:latest
# (деплой-скрипт добавляет актуальный IMAGE в .env на сервере автоматически)
#
# Запуск вручную:  docker compose pull && docker compose up -d
# Автодеплой:      push в main → GitHub Actions собирает образ и выполняет
#                  deploy/deploy.sh на сервере по SSH.

services:
  ai-dispute:
    image: ${IMAGE:-ghcr.io/rendysmith/ai_dispute:latest}
    container_name: ai-dispute
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # В контейнере браузеры всегда headless
      HEADLESS: "true"
      PROXY_ON: "false"
      RUNNING_IN_CONTAINER: "true"
      # Потолки для планировщика (см. utils/scheduler.py): браузеры не должны
      # запускаться сверх мощностей VDS (2 CPU / 4 ГБ)
      POD_CPU_LIMIT: "2"
      POD_MEM_GB_LIMIT: "4"
      # Жёсткий лимит одновременных парсеров (см. MAX_CONCURRENT_TASKS)
      MAX_CONCURRENT_TASKS: "2"
      # Таймауты с учётом практики: одна ссылка 10–15 мин, максимум 25–30 мин.
      # /run — адаптивно: число ссылок × LINK_TIMEOUT_SEC + запас на ИИ-анализ,
      # но не меньше TASK_TIMEOUT_SEC и не больше TASK_TIMEOUT_MAX_SEC.
      TASK_TIMEOUT_SEC: "14400"        # пол (4ч) и fallback
      TASK_TIMEOUT_MAX_SEC: "43200"    # потолок адаптивного таймаута (12ч)
      LINK_TIMEOUT_SEC: "2100"         # бюджет одной ссылки (35 мин)
      TASK_MARGIN_SEC: "7200"          # запас на review_analysis (2ч)
      FEEDBACK_TIMEOUT_SEC: "2100"     # /get_feedbacks: одна ссылка (35 мин)
      # Сторожевой цикл: интервал и правила убийства браузеров-зомби
      # (браузер одной ссылки не должен жить дольше 45 мин; сверх 6 шт — зомби)
      WATCHDOG_INTERVAL_SEC: "60"
      BROWSER_MAX_AGE_SEC: "2700"
      BROWSER_STARTUP_CLEAN_SEC: "900"
      BROWSER_MAX_COUNT: "6"
    ulimits:
      # Playwright/Chromium открывает много fd; лимит по умолчанию 1024
      # приводит к сбоям и «зависшим» браузерам
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Google service account — файл лежит на сервере, а не в git
      - ./secrets/service_account.json:/app/utils/service_account.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # Сервер: AMD 2 ядра / 4 ГБ. Планировщик внутри сервиса читает эти
          # лимиты из cgroup и не запускает парсеры сверх них (HTTP 429).
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
