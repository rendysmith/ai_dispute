name: Docker Image CI for ai-contestation

on:
  push:
    branches: [ "main" ] # Запускать при пуше в ветку main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # Необходимо для checkout
      packages: write   # Необходимо для пуша образов в GHCR
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-vds:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      # На VDS: docker compose pull && up -d && проверка healthz
      # (рабочая папка на сервере — /opt/ai-contestation, см. deploy/README.md)
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          script: |
            set -e
            cd /opt/ai-contestation
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f || true
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
                echo "OK: сервис здоров."
                exit 0
              fi
              sleep 2
            done
            echo "Ошибка: healthz не отвечает." >&2
            docker compose logs --tail=50 ai-contestation || true
            exit 1
