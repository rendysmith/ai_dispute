name: Docker Image CI for ai-contestation

on:
  push:
    branches: [ "main" ] # Запускать при пуше в ветку main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # Необходимо для checkout
      packages: write   # Необходимо для пуша образов в GHCR
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
    env:
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'default' }}
      # Пиним по digest, чтобы не зависеть от формата sha-тегов.
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build-and-push-image.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          kubectl version --client=true
          kubectl get ns "${KUBE_NAMESPACE}"

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          kubectl apply -n "${KUBE_NAMESPACE}" -f deploy/k8s/configmap.yaml
          kubectl apply -n "${KUBE_NAMESPACE}" -f deploy/k8s/secret.yaml
          kubectl apply -n "${KUBE_NAMESPACE}" -f deploy/k8s/deployment.yaml
          kubectl apply -n "${KUBE_NAMESPACE}" -f deploy/k8s/service.yaml

      - name: Pin Deployment to this image sha
        shell: bash
        run: |
          kubectl -n "${KUBE_NAMESPACE}" set image deployment/ai-contestation api="${IMAGE}"
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/ai-contestation --timeout=300s
