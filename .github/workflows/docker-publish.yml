name: Docker Image CI for ai_one_off

on:
  push:
    branches: [ "main" ] # Запускать при пуше в ветку main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # Необходимо для checkout
      packages: write   # Необходимо для пуша образов в GHCR

    # outputs: # Эту секцию можно оставить, если вы планируете использовать image_tag в других job'ах в будущем,
               # но для текущей конфигурации (только сборка и пуш) она не обязательна.
               # Если outputs не используется ни одним другим job'ом (который бы зависел от этого через 'needs'),
               # ее можно удалить для чистоты. Оставим пока, на всякий случай.
    #   image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # Имя пользователя или организации GitHub
          password: ${{ secrets.GITHUB_TOKEN }}      # Ваш Personal Access Token

      - name: Extract metadata (tags, labels) for Docker
        id: meta # Даем ID этому шагу, чтобы ссылаться на его выводы (если понадобятся outputs)
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # Используем github.repository напрямую
          tags: | # Как тегировать образ
            type=sha # Тег по SHA коммита, например, ghcr.io/user/app:sha-abcdef1
            type=raw,value=latest,enable={{is_default_branch}} # Тег 'latest' только для основной ветки

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Контекст сборки - корень репозитория (где Dockerfile)
          file: ./Dockerfile # Явное указание Dockerfile (если он не в корне, измените путь)
          push: true # Загружать образ после сборки
          tags: ${{ steps.meta.outputs.tags }} # Используем теги, сгенерированные шагом meta
          labels: ${{ steps.meta.outputs.labels }} # Используем метки, сгенерированные шагом meta

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
    env:
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'default' }}
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          kubectl version --client=true
          kubectl get ns "${KUBE_NAMESPACE}"

      - name: Apply CronJobs manifests
        shell: bash
        run: |
          kubectl apply -n "${KUBE_NAMESPACE}" -f deploy/automir-cronjob.yaml
          kubectl apply -n "${KUBE_NAMESPACE}" -f deploy/sberpolis-cronjob.yaml

      - name: Pin CronJobs to this image sha
        shell: bash
        run: |
          kubectl -n "${KUBE_NAMESPACE}" set image cronjob/ai-automir-workers automir="${IMAGE}"
          kubectl -n "${KUBE_NAMESPACE}" set image cronjob/ai-sberpolis-worker sberpolis="${IMAGE}"

      - name: Trigger immediate runs (optional)
        shell: bash
        run: |
          kubectl -n "${KUBE_NAMESPACE}" create job --from=cronjob/ai-automir-workers "automir-manual-${GITHUB_SHA::7}" || true
          kubectl -n "${KUBE_NAMESPACE}" create job --from=cronjob/ai-sberpolis-worker "sberpolis-manual-${GITHUB_SHA::7}" || true