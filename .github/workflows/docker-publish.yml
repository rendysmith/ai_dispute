name: Docker Image CI for ai-dispute

on:
  push:
    branches: [ "main" ] # Запускать при пуше в ветку main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # Необходимо для checkout
      packages: write   # Необходимо для пуша образов в GHCR
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-vds:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      # На VDS: docker compose pull && up -d && проверка healthz
      # (рабочая папка на сервере — /opt/ai-dispute, см. deploy/README.md)
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          # Первый pull образа (~1.5 ГБ) на медленном канале VDS идёт дольше
          # стандартных 10 минут — таймаут команды поднят до 60 минут.
          # Последующие деплои тянут только изменившиеся слои (секунды).
          command_timeout: 60m
          script: |
            set -e
            cd /opt/ai-dispute

            # Предпроверка обязательных файлов на сервере (CI их не создаёт)
            [ -f .env ] || { echo "Ошибка: /opt/ai-dispute/.env не найден на сервере" >&2; exit 1; }
            if [ ! -f secrets/service_account.json ]; then
              echo "Ошибка: secrets/service_account.json не найден на сервере (или Docker создал папку вместо файла)." >&2
              echo "Положите файл: scp service_account.json root@<VDS>:/opt/ai-dispute/secrets/" >&2
              exit 1
            fi

            # Синхронизация docker-compose.yml из публичного репозитория —
            # конфигурация на сервере всегда совпадает с кодом
            if command -v curl >/dev/null 2>&1; then
              if curl -fsSL --max-time 30 https://raw.githubusercontent.com/rendysmith/ai_dispute/main/docker-compose.yml -o docker-compose.yml.new 2>/dev/null \
                 && grep -q '^services:' docker-compose.yml.new \
                 && grep -q 'secrets/service_account.json' docker-compose.yml.new; then
                mv docker-compose.yml.new docker-compose.yml
                echo "docker-compose.yml обновлён из репозитория"
              else
                rm -f docker-compose.yml.new
                echo "Внимание: не удалось скачать compose — используем текущий файл" >&2
              fi
            fi
            grep -q 'secrets/service_account.json' docker-compose.yml \
              || { echo "Ошибка: compose на сервере не монтирует secrets/service_account.json" >&2; exit 1; }

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f || true
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
                echo "OK: сервис здоров."
                docker compose ps
                exit 0
              fi
              sleep 2
            done
            echo "Ошибка: healthz не отвечает." >&2
            docker compose ps >&2 || true
            docker compose logs --tail=80 >&2 || true
            exit 1
