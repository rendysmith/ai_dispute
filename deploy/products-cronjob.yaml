# УСТАРЕЛ: не используйте этот манифест.
#
# Вместо него:
#   - deploy/automir-cronjob.yaml   (4 воркера ↔ 4 ноды)
#   - deploy/sberpolis-cronjob.yaml (1 воркер)
#
# Причина: Indexed Job на products/main_products.py имел только 2 задачи
# (index 0=automir, 1=sber_polis), а при completions=4 pod'ы 2/3 выходили
# с "нет задачи", и automir не шардировался на 4 воркера.
#
# Удалить старый CronJob:
#   kubectl delete cronjob ai-products-cronjob ai-automir-cronjob -n default
#
# Применить новые:
#   kubectl apply -f deploy/automir-cronjob.yaml
#   kubectl apply -f deploy/sberpolis-cronjob.yaml
