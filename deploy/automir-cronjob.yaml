# Automir launcher: по расписанию считает свободные ноды и создаёт Indexed Job с N воркерами.
#
# Worker Job'ы создаются динамически (automir-run-YYYYMMDDHHMMSS), не этим манифестом.
#
# Перед применением:
#   1. kubectl create secret generic products-env --from-env-file=.env -n default
#   2. kubectl apply -f deploy/automir-rbac.yaml
#   3. kubectl apply -f deploy/automir-cronjob.yaml
#   4. kubectl delete cronjob ai-automir-workers -n default --ignore-not-found  # старая схема

apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-automir-launcher
  namespace: default
spec:
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: ai-automir-launcher
        spec:
          restartPolicy: Never
          serviceAccountName: automir-launcher
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: launcher
              image: ghcr.io/rendysmith/ai_one_off:latest
              imagePullPolicy: Always
              env:
                - name: KUBERNETES_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: AUTOMIR_IMAGE
                  value: ghcr.io/rendysmith/ai_one_off:latest
                - name: AUTOMIR_MAX_WORKERS
                  value: "4"
                - name: AUTOMIR_MIN_WORKERS
                  value: "1"
                # Нода считается свободной, если остаётся столько ресурсов под лимит воркера
                - name: AUTOMIR_SCHEDULE_MEMORY
                  value: "3Gi"
                - name: AUTOMIR_SCHEDULE_CPU
                  value: "500m"
                - name: AUTOMIR_WORKER_MEMORY_REQUEST
                  value: "256Mi"
                - name: AUTOMIR_WORKER_MEMORY_LIMIT
                  value: "3Gi"
                - name: AUTOMIR_WORKER_CPU_REQUEST
                  value: "200m"
                - name: AUTOMIR_WORKER_CPU_LIMIT
                  value: "1500m"
                - name: AUTOMIR_SECRET_NAME
                  value: products-env
                - name: AUTOMIR_IMAGE_PULL_SECRET
                  value: ghcr-secret
              command:
                - python3
                - -u
                - products/automir_launcher.py
