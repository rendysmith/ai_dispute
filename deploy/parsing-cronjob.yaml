# Парсинг: один CronJob, N pod'ов (Indexed Job), каждый pod — одна задача из PARSING_TASKS в scaling_service.py
#
# Добавить парсер: только строка в PARSING_TASKS (scaling_service.py).
# Манифест не трогать, пока len(PARSING_TASKS) <= PARSING_MAX_WORKERS (8).
#
# Перед применением:
#   1. Заменить image на ваш GHCR-образ
#   2. Создать Secret parsing-env из .env (kubectl create secret generic parsing-env --from-env-file=.env)

apiVersion: batch/v1
kind: CronJob
metadata:
  name: parsing-workers
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: 8
      parallelism: 8
      completionMode: Indexed
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: parsing-workers
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: parsing-workers
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: parser
              image: ghcr.io/OWNER/ai_one_off:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
              args:
                - >-
                  Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
                  export DISPLAY=:99 &&
                  python3 -u scaling_service.py
              envFrom:
                - secretRef:
                    name: parsing-env
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "1000m"
                limits:
                  memory: "4Gi"
                  cpu: "2000m"
