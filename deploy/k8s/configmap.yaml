apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-dispute-config
  labels:
    app: ai-dispute
data:
  # В контейнере браузеры всегда headless
  HEADLESS: "true"
  PROXY_ON: "false"
  RUNNING_IN_CONTAINER: "true"
  # Максимальная пауза ожидания между запросами к сайтам (сек)
  MAX_SEC: "30"
  # Время жизни задач (сек): /run — до 8 часов, /get_feedback — 15 минут
  TASK_TIMEOUT_SEC: "28800"
  FEEDBACK_TIMEOUT_SEC: "900"
  # Веса задач для admission control (CPU ядер / память ГБ на один запуск)
  # Лимиты пода берутся из cgroup автоматически (deployment.yaml: 2 CPU / 4Gi)
  TASK_CPU_RUN: "1.0"
  TASK_MEM_RUN: "1.5"
  TASK_CPU_GET_FEEDBACK: "0.7"
  TASK_MEM_GET_FEEDBACK: "1.0"
  BASE_CPU: "0.3"
  BASE_MEM_GB: "0.5"
