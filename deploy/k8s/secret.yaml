apiVersion: v1
kind: Secret
metadata:
  name: ai-contestation-secret
  labels:
    app: ai-contestation
type: Opaque
# ⚠️ ШАБЛОН. Замените значения на реальные перед применением:
#   kubectl create secret generic ai-contestation-secret \
#     --from-literal=POSTGRESQL_HOST=... \
#     --from-literal=POSTGRESQL_PORT=... \
#     --from-literal=POSTGRESQL_DB=... \
#     --from-literal=POSTGRESQL_USERNAME=... \
#     --from-literal=POSTGRESQL_PASSWORD=... \
#     --from-literal=HOST_USERNAME=... \
#     --from-literal=HOST_PASSWORD=... \
#     --from-literal=CAPTCHA_KEY=... \
#     --from-literal=API_TOKEN=... \
#     -n <namespace>
stringData:
  POSTGRESQL_HOST: "postgres-host"
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_DB: "contestation"
  POSTGRESQL_USERNAME: "user"
  POSTGRESQL_PASSWORD: "password"
  HOST_USERNAME: "user@example.com"
  HOST_PASSWORD: "password"
  CAPTCHA_KEY: "2captcha-api-key"
  # Токен Bearer-авторизации API (пустой — авторизация отключена)
  API_TOKEN: "change-me"
